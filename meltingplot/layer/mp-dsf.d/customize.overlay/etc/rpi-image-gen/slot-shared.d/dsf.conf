# Duet state that has to survive an update and a rollback.
#
# The root filesystem is read-only and there are two of them, one per slot. A
# path listed here is bind mounted from the persistent partition, so both slots
# see the same data (layer slot-state). Files the device added stay. What the
# image ships below these paths has to replace the device's copy on every
# boot, which is how an update also updates the printer configuration and
# Duet Web Control: that takes a StaticPath per file, which the build lists in
# dsf-static.conf (mp-dsf.d/hooks/postbuild40-dsf-static).
#
# firmware/ is deliberately absent: the Duet mainboard firmware belongs to the
# slot it was delivered with, so a rollback puts the matching firmware back.
Version=1
SharedPath=/opt/dsf/sd/sys
SharedPath=/opt/dsf/sd/gcodes
SharedPath=/opt/dsf/sd/macros
SharedPath=/opt/dsf/sd/filaments
SharedPath=/opt/dsf/sd/menu
SharedPath=/opt/dsf/sd/www
SharedPath=/opt/dsf/sd/Vigil
SharedPath=/opt/dsf/sd/QualityAssurance
SharedPath=/opt/dsf/plugins
SharedPath=/opt/dsf/conf
