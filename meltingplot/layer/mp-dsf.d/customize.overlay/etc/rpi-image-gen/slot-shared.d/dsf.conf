# Duet state that has to survive an update and a rollback.
#
# The root filesystem is read-only and there are two of them, one per slot. A
# path listed here is bind mounted from the persistent partition, so both slots
# see the same data. Whatever the image ships below such a path is copied over
# the device's copy on every boot, which is how an update also updates the
# printer configuration and Duet Web Control. Since upstream 19bcf1d that
# takes a StaticPath per file: the build lists them in dsf-static.conf
# (mp-dsf.d/hooks/postbuild40-dsf-static). Files the device added stay.
#
# firmware/ is deliberately absent: the Duet mainboard firmware belongs to the
# slot it was delivered with, so a rollback puts the matching firmware back.
Version=1
Path=/opt/dsf/sd/sys
Path=/opt/dsf/sd/gcodes
Path=/opt/dsf/sd/macros
Path=/opt/dsf/sd/filaments
Path=/opt/dsf/sd/menu
Path=/opt/dsf/sd/www
Path=/opt/dsf/sd/Vigil
Path=/opt/dsf/sd/QualityAssurance
Path=/opt/dsf/plugins
Path=/opt/dsf/conf
