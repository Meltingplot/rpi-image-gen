# Second line of defence behind the AppArmor plugin policy. A plugin the image
# did not ship must not be able to run code on the printer, so nothing on
# writable storage is executable and the service can only write where plugins
# legitimately keep their files.
#
# /opt/dsf/plugins is not in NoExecPaths: a bundled Python plugin runs through
# the interpreter symlink in its own virtual environment.
#
# NoNewPrivileges also shapes the AppArmor profile: under no_new_privs the
# kernel only allows an exec transition that keeps the current profile in the
# new label, so the profile stacks its child profiles instead of entering them.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/opt/dsf/plugins /opt/dsf/sd /opt/dsf/conf /run/dsf
NoExecPaths=/opt/dsf/sd /persistent /home /var /tmp
