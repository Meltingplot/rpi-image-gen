# The packaged unit has no ordering of its own, so it can start before the
# machine-owned configuration has been seeded and before the shared mounts of
# the virtual SD card are in place. Both would make it read an empty config.g.
[Unit]
After=mp-dsf-seed.service opt-dsf-sd-sys.mount opt-dsf-conf.mount
Requires=mp-dsf-seed.service
