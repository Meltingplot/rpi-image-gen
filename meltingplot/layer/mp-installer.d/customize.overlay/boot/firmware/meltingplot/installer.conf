# Meltingplot installer card - settings
#
# This card writes the Meltingplot image to the NVMe drive of a Raspberry Pi 5
# and makes the Pi start from that drive. Put the card in, power the Pi up and
# wait about two minutes:
#   green LED flickers fast and evenly   the card is at work. Taking the power
#                                        away now does no harm: the next start
#                                        writes the drive again.
#   green LED on, steady                 the bootloader is written, then the Pi
#                                        restarts into the drive. Keep the
#                                        power on now: a cut can leave a Pi that
#                                        no longer starts at all.
# The card can stay in; the Pi now starts from the drive first.
#
# On the operator panel the display shows the same: while the card works,
# full white, red, green and blue in turn, a few seconds each, to check the
# panel for dead pixels and colour faults, and the progress in between; once
# the bootloader is written or the card stopped, the progress stays.
#
# If the red LED comes on and the green one blinks a number of times, pauses
# and repeats, the card stopped without restarting. meltingplot/installer.log
# on this card says why. The number of green blinks:
#   2  no NVMe drive, or more than one
#   3  the drive is not empty (see overwrite_nvme below)
#   4  identity.conf on this card is not usable
#   5  this card installed the drive already, but the Pi started from the
#      card again: the bootloader does not start the drive
#   6  anything else: the card, the drive or the bootloader update
#
# Before installing, edit meltingplot/identity.conf on this card for the
# printer it goes into. The installer hands it to the drive and puts the
# blank file back here, so the card is ready for the next printer.
#
# Lines starting with # are comments, whitespace around = is ignored.

# A drive that holds a partition table or a filesystem is left alone, so a
# card put into a printer that is already in use cannot erase it. To install
# over such a drive anyway, take the # off the next line. Everything on the
# drive is lost: printer configuration, calibration and G-code files. The
# line is spent with that one installation.
#overwrite_nvme=yes
