# METABEGIN
# X-Env-Layer-Name: mp-duet-hw
# X-Env-Layer-Category: device
# X-Env-Layer-Desc: Raspberry Pi side of the SPI link to a Duet 3 mainboard,
#  as DuetPi configures it: SPI enabled, a spidev buffer large enough for the
#  DSF transfer size, an immediate reboot on kernel panic so a printer does
#  not sit dead, and the memory cgroup controller so the Memory* directives
#  of the DuetControlServer unit take effect. Also turns on AppArmor, which
#  the plugin policy relies on.
# X-Env-Layer-Version: 1.2.0
# X-Env-Layer-Requires: rpi-boot-firmware
# X-Env-Layer-RequiresProvider: hw:device:rpi:pi5
# METAEND
---
mmdebstrap:
  packages:
    # gpioinfo/gpioget, for checking the transfer ready pin on a bench
    - gpiod
# config.txt and the kernel command line are assembled from the fragments of
# every layer since upstream ff5fb45 (rpi-boot-firmware config.txt.d,
# linux-base cmdline.d); anything written into the files before that is lost.
# This layer's fragments are in mp-duet-hw.d/for/:
#
#   rpi-boot-firmware/config.txt.d/80-mp-duet-hw
#      dtparam=spi=on, the link to the Duet mainboard
#   linux-base/cmdline.d/80-mp-duet-hw
#      two kernel parameters, both as DuetPi sets them
#
# lsm=apparmor: AppArmor confines DuetPluginService so third party plugins
# cannot run code on the printer. The LSM has to be selected on the kernel
# command line.
#
# cgroup_enable=memory: the Pi kernel disables the memory cgroup controller
# by default, which turns MemoryMin=256M and MemorySwapMax=0 in the
# packaged duetcontrolserver.service into no-ops. DSF 3.7.0-rc.1 added
# MemoryMin (commit 4d67a3e0) against SPI transfer timeouts caused by
# DuetControlServer pages being reclaimed and re-read from the card, and
# DuetPi enabled the controller the same day (commit ba98dbb7).
#
# hooks/late/preimage90-boot-check makes sure all three reached the files the
# boot partition gets.
