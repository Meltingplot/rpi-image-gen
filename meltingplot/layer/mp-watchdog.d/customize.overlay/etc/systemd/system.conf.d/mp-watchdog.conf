# Written for rpi-image-gen layer mp-watchdog.
#
# systemd opens /dev/watchdog0, the watchdog of the BCM2712's power
# management block (bcm2835-wdt), and pets it every half interval. 15 s is
# the longest the hardware counts: 20 bits at 65536 Hz, just under 16 s, of
# which the driver offers whole seconds. The kernel accepts a longer value,
# but then pets the hardware itself in between, and only a hang of the
# kernel would still restart the computer within 16 s.
[Manager]
RuntimeWatchdogSec=15s
