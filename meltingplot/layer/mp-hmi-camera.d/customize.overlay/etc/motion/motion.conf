# Written for rpi-image-gen layer mp-hmi-camera.
#
# The camera module through libcamera's V4L2 compatibility layer, which
# motion.service preloads. motion passes the picture on and nothing else: no
# motion detection, no pictures or films, no web control. No log_file either:
# motion gives up for good when it cannot open one, and the root is read-only;
# without it, the journal gets the log.

daemon off
log_level 5
target_dir /run/motion

# 1280x960 is the binned full field of view of the OV5647. Both sides have to
# be multiples of 8, which the sensor's own 1296x972 is not.
video_device /dev/video0
width 1280
height 960
framerate 15

pause on
emulate_motion off
picture_output off
movie_output off
snapshot_interval 0

# Stream and snapshot (/0/current) on the loopback only; haproxy passes them on.
# The defaults would send one frame a second at half quality.
stream_port 8081
stream_localhost on
stream_quality 75
stream_maxrate 15
stream_motion off

webcontrol_port 0
