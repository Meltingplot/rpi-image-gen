# Written for rpi-image-gen layer mp-hmi-camera.
#
# The printer camera, a Meltingplot rpi-camera on USB (mp-hmi-net). It reaches
# the panel as a network adapter and serves its MJPEG stream at its fixed
# address 10.55.0.1, the same on every such camera. motion is its only client
# and hands the picture to everyone else, so the camera's small computer
# serves one stream however many browsers watch. motion passes the picture on
# and nothing else: no motion detection, no pictures or films, no web control.
# No log_file either: motion gives up for good when it cannot open one, and
# the root is read-only; without it, the journal gets the log.
#
# The camera module of the panel itself is not streamed; it is kept for
# scanning QR codes on the panel.

daemon off
log_level 5
target_dir /run/motion

# capture_rate is how fast motion reads the stream. Reading slower than the
# camera sends piles pictures up in the connection and the picture falls
# behind; 30 is the most a camera on a Pi Zero 2 W offers. The size is the
# camera's own, 1920x1080; a camera set to another size in its web interface
# is scaled to this one. motion connects within some 20 seconds, and again
# whenever the camera comes back.
netcam_url http://10.55.0.1:8081/
netcam_params capture_rate=30
width 1920
height 1080
framerate 15

pause on
emulate_motion off
picture_output off
movie_output off
snapshot_interval 0

# Stream and snapshot (/0/current) on the loopback only; haproxy passes them on.
# The defaults would send one frame a second at half quality.
stream_port 8081
stream_localhost on
stream_quality 75
stream_maxrate 15
stream_motion off

webcontrol_port 0
