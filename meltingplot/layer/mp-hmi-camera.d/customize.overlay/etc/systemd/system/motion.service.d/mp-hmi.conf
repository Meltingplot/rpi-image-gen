# Written by rpi-image-gen layer mp-hmi-camera.
[Service]
# motion 4.7 reads V4L2 only; libcamera translates for it
Environment=LD_PRELOAD=/usr/libexec/aarch64-linux-gnu/libcamera/v4l2-compat.so
Environment=LIBCAMERA_LOG_LEVELS=*:WARN
ExecStart=
ExecStart=/usr/bin/motion -n -c /etc/motion/motion.conf
RuntimeDirectory=motion
WorkingDirectory=/run/motion
Restart=always
RestartSec=5
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
NoNewPrivileges=yes
