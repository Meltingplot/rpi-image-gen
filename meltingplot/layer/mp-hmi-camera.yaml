# METABEGIN
# X-Env-Layer-Name: mp-hmi-camera
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: The printer camera as an MJPEG stream and a snapshot,
#  served by motion on the loopback for mp-hmi-proxy, which passes them on as
#  /webcam and /snapshot. The camera is a Meltingplot rpi-camera on USB, a
#  network adapter to the panel (mp-hmi-net); motion is its only client and
#  hands the picture on to every viewer, so the camera's small computer serves
#  one stream. motion only passes the picture on: no motion detection, nothing
#  written, and a JPEG is only encoded while somebody watches. The panel's own
#  camera module is not streamed; it is kept for scanning QR codes.
# X-Env-Layer-Version: 2.0.0
# X-Env-Layer-Requires: mp-hmi-net
# X-Env-Layer-RequiresProvider: systemd
# METAEND
---
mmdebstrap:
  packages:
    - motion
  customize-hooks:
    - $BDEBSTRAP_HOOKS/enable-units "$1" motion
