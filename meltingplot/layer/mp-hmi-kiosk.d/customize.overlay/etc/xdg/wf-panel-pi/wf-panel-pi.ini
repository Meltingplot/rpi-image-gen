# Written for rpi-image-gen layer mp-hmi-kiosk.
#
# The panel of the operator panel: network, keyboard and clock, nothing to
# start programs from. It hides at the top edge and keeps a strip there. A
# swipe down from that edge brings it down (mp-kiosk-panel switches autohide
# off in the user's copy of this file), and then it lies over the page on the
# top layer instead of pushing the page down.
[panel]
position=top
autohide=true
autohide_duration=300
remainder=5
layer=top
exclusive=false
icon_size=40
widgets_left=
widgets_right=netman squeek clock
