# Settings every Meltingplot printer computer shares.
#
# One image serves every printer of a kind: what makes a device unique arrives
# at commissioning time in meltingplot/identity.conf on the boot partition, not
# at build time. The image carries that file, every line commented out, see
# layer/mp-identity.d/customize.overlay/bootfs/meltingplot/identity.conf.

device:
  layer: rpi5
  user1: meltingplot
  user1uid: 1000
  user1gid: 1000
  # user1 is the account Raspberry Pi Connect runs as, so its remote shell is
  # this account, reachable from wherever Connect is. It holds no privileges:
  # it may read the journal, and it touches neither the printer's files and
  # plugins (dsf) nor the hardware (spi, gpio, i2c) behind the control
  # server's back. video is there because Connect signs in with the device
  # identity, which the firmware hands out through /dev/vcio_crypto to that
  # group only, as on Raspberry Pi OS (mp-connect). Root is for the
  # administrator of mp-admin, from the printer network only.
  user1groups: adm,video
  # passwd, not none: none has device-user-admin purge sudo, which the
  # administrator needs. The account has no password and the root filesystem
  # is read-only, so the password sudo asks for can never be given; the
  # post-build assert of mp-admin checks that it is locked.
  user1sudo: passwd
  # Only recorded in the provisioning descriptor. The image itself finds its
  # root by GPT label and runs from an SD card or an NVMe drive unchanged.
  storage_type: sd

image:
  layer: image-rota
  rootfs_type: erofs
  boot_part_size: 128M
  # Base system about 400 MB, DSF with its .NET runtime and Duet Web Control
  # about 200 MB, the rest is headroom for a release to grow into.
  system_part_size: 1G
  # Starting size only. mp-growfs expands it to the medium on first boot, and
  # rpi-sb-provisioner does the same while provisioning.
  data_part_size: 4G

ssh:
  pubkey_user1: ${@SRCROOT}/keys/authorized_keys
  pubkey_only: y

mpadmin:
  pubkeys: ${@SRCROOT}/keys/mpadmin.keys

connect:
  # No auth key in the image. A device signs in on first boot from the key that
  # commissioning left for it. Quoted because YAML reads a bare on as a boolean.
  "on": y

artefact:
  # A local build is always a development build, which is what allows it to
  # carry prereleases. The release workflow passes a version from the git tag.
  version: 0.0.0-dev.$(date -u +%Y%m%d%H%M)

sbom:
  # The SBOM describes the filesystem as a product with a version rather than
  # under a versioned name, so the statements in ../vex.openvex.json apply to
  # every build through one product identifier, pkg:generic/filesystem. The
  # file keeps its versioned name.
  name: ${IGconf_artefact_target_name}
  filename: ${IGconf_sbom_name}-${IGconf_sbom_version}.sbom

layer:
  suite: mp-suite-trixie
  connect: mp-connect
  identity: mp-identity
  admin: mp-admin
