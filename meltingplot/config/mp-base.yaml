# Settings every Meltingplot printer computer shares.
#
# One image serves every printer of a kind: what makes a device unique arrives
# at commissioning time in meltingplot/identity.conf on the boot partition, not
# at build time. The image carries that file, every line commented out, see
# layer/mp-identity.d/customize.overlay/bootfs/meltingplot/identity.conf.

device:
  layer: rpi5
  user1: meltingplot
  user1uid: 1000
  user1gid: 1000
  # user1 is the account Raspberry Pi Connect runs as, so its remote shell is
  # this account, reachable from wherever Connect is. It holds no privileges:
  # it may read the journal, and it touches neither the printer's files and
  # plugins (dsf) nor the hardware (spi, gpio, i2c) behind the control
  # server's back. video is there because Connect signs in with the device
  # identity, which the firmware hands out through /dev/vcio_crypto to that
  # group only, as on Raspberry Pi OS (mp-connect). Root is for the
  # administrator of mp-admin, from the printer network only.
  user1groups: adm,video
  # passwd, not none: none has device-user-admin purge sudo, which the
  # administrator needs. The account has no password and the root filesystem
  # is read-only, so the password sudo asks for can never be given; the
  # post-build assert of mp-admin checks that it is locked.
  user1sudo: passwd
  # Only recorded in the provisioning descriptor (IDP), where it decides the
  # drive rpi-fastbootd writes: nvme is /dev/nvme0n1, sd /dev/mmcblk0. The
  # image itself finds its root by GPT label and runs from either unchanged.
  # The target medium is always an NVMe SSD of at least 128 GB
  # (docs/meltingplot-layout.md, decision 4).
  storage_type: nvme

# Both computers run from an NVMe SSD on an M.2 HAT, declared the way
# config/device/pi5.yaml of rpi-image-gen does it. It is what allows
# device.storage_type nvme.
trait:
  hw:storage:nvme: true
  hw:pcie:m2: true

image:
  layer: image-rota
  rootfs_type: erofs
  # An update brings the boot filesystem at exactly this size, so it stays as
  # long as devices written with it are in the field: a larger one would not
  # fit their boot slots. The boot ramdisk takes about 50 MB of it.
  boot_part_size: 128M
  # A device keeps the slots it was first written with: an update replaces the
  # system in a slot, never the partition table, so the slot has to hold every
  # release the device will get. The update brings the system at its own size,
  # not the slot's, and fits any slot it is not larger than. Today the system
  # takes about 0.45 GB on the printer SBC and 0.7 GB on the operator panel.
  # Devices written before had 1G (printer SBC) and 2G (operator panel) slots
  # and keep them until they are written anew. The same on both computers.
  system_part_size: 4G
  # Starting size only. mp-growfs expands it to the medium on first boot, and
  # rpi-sb-provisioner does the same while provisioning.
  data_part_size: 4G
  # Layout gen4 (docs/meltingplot-layout.md). gen1 (1G/2G slots), gen2 (4G
  # slots) and gen3 (audit 512M) move over with the installer card; an update
  # cannot change a partition table.
  #
  # The partition of the audit log (docs/meltingplot-audit-log.md, AL-33):
  # nothing mounts it but the log service, in its own namespace. Half for the
  # device's own log over five years, half for the copy of the other
  # computer's log: 2 x 256 MiB, which an ext4 of 1 GiB with 4 KiB blocks
  # holds with room to spare (973 MiB usable; 512M with 16 KiB blocks gave
  # only 440, layout decision 5). Shipped without a filesystem, so that
  # mp-auditd formats it with the device's defaults (LY-04); the build checks
  # that the shares fit (LY-06, mp-audit).
  private_part_name: audit
  private_part_size: 1G
  private_part_fs: none
  # Space a later update takes to change the layout in the field (LY-01 to
  # LY-03): new partitions, the audit partition growing into it, the system
  # slots doubled. Never mounted, no filesystem, never written.
  reserve_part_size: 16G

ssh:
  pubkey_user1: ${@SRCROOT}/keys/authorized_keys
  pubkey_only: y

mpadmin:
  pubkeys: ${@SRCROOT}/keys/mpadmin.keys

connect:
  # No auth key in the image. A device signs in on first boot from the key that
  # commissioning left for it. Quoted because YAML reads a bare on as a boolean.
  "on": y

connectota:
  # The update bundle has to suit the applicator of the device receiving it,
  # which is the one in the image that device runs now. rpi-connect-ota 1.3.18
  # cannot read a manifest-only bundle, and otamaker means to make that its
  # default, so no sync with upstream gets to change this behind our back.
  bfmt: transitional

artefact:
  # A local build is always a development build, which is what allows it to
  # carry prereleases. The release workflow passes a version from the git tag.
  version: 0.0.0-dev.$(date -u +%Y%m%d%H%M)

sbom:
  # The SBOM describes the filesystem as a product with a version rather than
  # under a versioned name, so the statements in ../vex.openvex.json apply to
  # every build through one product identifier, pkg:generic/filesystem. The
  # file keeps its versioned name.
  name: ${IGconf_artefact_target_name}
  filename: ${IGconf_sbom_name}-${IGconf_sbom_version}.sbom

layer:
  suite: mp-suite-trixie
  # The Connect client: shell only on the printer SBC. The operator panel
  # takes rpi-connect, which also shares the screen.
  connectclient: rpi-connect-lite
  connect: mp-connect
  identity: mp-identity
  admin: mp-admin
  watchdog: mp-watchdog
  audit: mp-audit
  layout: mp-layout
